version: '20.0'

name: project_local
services:
  db:
    container_name: project_database
    image: mysql:latest
    command: mysqld --authentication_policy=mysql_native_password
    restart: always
    networks:
      - project
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: project
      MYSQL_USER: project
      MYSQL_PASSWORD: 123123
      MYSQL_ROOT_PASSWORD: 123123
    ports:
      - 3306:3306

  cache:
    container_name: project_redis
    image: redis:alpine3.18
    restart: always
    networks:
      - project
    ports:
      - 6379:6379

networks:
  project:
    driver: bridge
